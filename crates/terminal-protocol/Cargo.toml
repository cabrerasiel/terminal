[package]
name = "terminal-protocol"
version = "0.1.0"
edition = "2024"
description = "Shared wire protocol, layout geometry and configuration types for the window and the server process"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
portable-pty = "0.9.0"
base64 = "0.22"
serde_json = "1.0.145"
sha1_smol = "1.0"
libghostty-vt = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
